<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://text.pollinations.ai https://api.open-meteo.com https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#07040f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capri">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Capri</title>
<style>
  :root{--cyan:#00f0ff;--pink:#ff2bd6;--yellow:#fcee0a;--bg:#07040f;--panel:#0e0a1f;--text:#d8e6ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
    font-family:"Share Tech Mono","Courier New",ui-monospace,monospace,"Noto Sans","Noto Sans CJK SC","Noto Sans Devanagari","Noto Sans Arabic",sans-serif;
    -webkit-text-size-adjust:100%}
  body{background:radial-gradient(900px 500px at 15% -10%,#2a0b4d66,transparent),
              radial-gradient(700px 400px at 100% 100%,#00f0ff22,transparent),var(--bg)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}

  #app{height:100dvh;max-width:680px;margin:0 auto;display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--cyan);
    box-shadow:0 4px 18px #00f0ff22;background:#0e0a1fcc}
  #pet{width:72px;height:72px;flex:none;display:flex;align-items:flex-end;justify-content:center}
  #petInner{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;animation:float 3s ease-in-out infinite}
  #petInner img,#petInner svg{max-width:100%;max-height:100%;filter:drop-shadow(0 0 8px var(--pink))}
  #pet.talking #petInner{animation:float 3s ease-in-out infinite,pulse .35s infinite alternate}
  #pet.thinking #petInner img,#pet.thinking #petInner svg{filter:drop-shadow(0 0 12px var(--yellow)) hue-rotate(40deg)}
  @keyframes float{50%{transform:translateY(-5px)}}
  @keyframes pulse{from{scale:1}to{scale:1.05}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .title{flex:1;min-width:0}
  h1{font-size:20px;letter-spacing:4px;color:var(--yellow);text-shadow:2px 0 var(--pink),-2px 0 var(--cyan)}
  #brain{font-size:11px;letter-spacing:1px;color:var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #brain.on{color:#3dff7a}
  .actions{display:flex;gap:6px}
  .ibtn{width:40px;height:40px;display:grid;place-items:center;background:none;border:1px solid var(--cyan);
    color:var(--cyan);cursor:pointer;border-radius:8px}
  .ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ibtn.on{background:var(--cyan);color:#000}
  .ibtn[hidden]{display:none}

  #log{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:10px;
    -webkit-user-select:text;user-select:text}
  .msg{max-width:88%;padding:9px 12px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .bot{align-self:flex-start;border-inline-start:3px solid var(--cyan);background:#00f0ff12}
  .me{align-self:flex-end;border-inline-end:3px solid var(--pink);background:#ff2bd612}
  .dots span{animation:d 1s infinite;display:inline-block}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes d{50%{opacity:.15}}

  .msg.md{white-space:normal}
  .msg.md p{white-space:pre-wrap;margin:0 0 .6em}
  .msg.md ul,.msg.md ol{margin:0 0 .6em;padding-inline-start:1.4em}
  .msg.md li{margin:.15em 0;white-space:pre-wrap}
  .msg.md .h{font-weight:bold;color:var(--yellow);margin:.3em 0 .4em}
  .msg.md pre{overflow-x:auto;background:#050210;border:1px solid #00f0ff44;padding:8px 10px;margin:.4em 0 .7em;
    font-size:13px;line-height:1.4;white-space:pre;direction:ltr;text-align:left}
  .msg.md code{background:#00f0ff18;padding:0 3px;font-size:.93em}
  .msg.md pre code{background:none;padding:0}
  .msg.md a{color:var(--yellow);overflow-wrap:anywhere}
  .msg.md strong{color:#fff}
  .msg.md > :last-child{margin-bottom:0}
  #hint{display:none;align-items:center;gap:8px;margin:0 14px 8px;padding:8px 10px;font-size:13px;
    border:1px dashed var(--yellow);color:var(--yellow)}
  #hint.show{display:flex}
  #hint span{flex:1}
  #hint button{background:none;border:0;color:inherit;font-size:20px;line-height:1;padding:4px 8px}
  #chip{display:none;align-items:center;gap:8px;margin:0 14px 8px;padding:6px 10px;font-size:13px;
    border:1px solid var(--pink);color:var(--pink);align-self:flex-start;max-width:calc(100% - 28px)}
  #chip.show{display:flex}
  #chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #chip button{background:none;border:0;color:inherit;font-size:18px;line-height:1;padding:2px 6px}

  form{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--cyan);background:#0e0a1fcc}
  #input{flex:1;min-width:0;height:44px;background:#050210;border:1px solid #00f0ff66;border-radius:8px;
    color:var(--text);font:inherit;font-size:16px;padding:0 12px;outline:none}
  #input:focus{border-color:var(--cyan);box-shadow:0 0 8px #00f0ff55}
  .send{height:44px;padding:0 18px;background:var(--pink);border:0;border-radius:8px;color:#000;
    font:inherit;font-weight:bold;font-size:15px;cursor:pointer}
  #floatNote{display:none;position:absolute;inset:0;z-index:5;place-items:center;text-align:center;padding:30px;
    background:var(--bg);color:var(--yellow);font-size:16px;line-height:1.5}
  #floatNote.show{display:grid}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="pet">
      <div id="petInner">
        <img id="avatarImg" alt="Capri" hidden>

          <circle cx="100" cy="18" r="6" fill="#ff2bd6"/>

          <rect x="26" y="78" width="14" height="30" rx="4" fill="#ff2bd6"/>
          <rect x="160" y="78" width="14" height="30" rx="4" fill="#ff2bd6"/>
          <rect x="54" y="68" width="92" height="34" rx="8" fill="#050210" stroke="#ff2bd6" stroke-width="2"/>
          <rect class="eye" x="66" y="76" width="22" height="18" rx="3" fill="#00f0ff"/>
          <rect class="eye" x="112" y="76" width="22" height="18" rx="3" fill="#00f0ff"/>
          <rect x="82" y="112" width="36" height="8" rx="3" fill="#fcee0a"/>
          <rect x="62" y="140" width="76" height="52" rx="10" fill="#140b2e" stroke="#ff2bd6" stroke-width="3"/>
          <circle cx="100" cy="166" r="10" fill="none" stroke="#fcee0a" stroke-width="2"/>
          <circle cx="100" cy="166" r="4" fill="#fcee0a"/>
          <rect x="44" y="146" width="14" height="36" rx="6" fill="#00f0ff"/>
          <rect x="142" y="146" width="14" height="36" rx="6" fill="#00f0ff"/>
          <rect x="72" y="196" width="18" height="16" rx="4" fill="#ff2bd6"/>
          <rect x="110" y="196" width="18" height="16" rx="4" fill="#ff2bd6"/>
        </svg>
      </div>
    </div>
    <div class="title"><h1>CAPRI</h1><div id="brain"></div></div>
    <div class="actions">
      <button class="ibtn" id="soundBtn" type="button" aria-label="sound">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="ibtn" id="avatarBtn" type="button" aria-label="avatar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      </button>
      <button class="ibtn" id="floatBtn" type="button" aria-label="float" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/></svg>
      </button>
    </div>
  </header>

  <div id="log" aria-live="polite"></div>

  <div id="hint"><span id="hintText"></span><button type="button" id="hintX" aria-label="close">×</button></div>
  <div id="chip"><span id="chipName"></span><button type="button" id="chipX" aria-label="remove">×</button></div>

  <form id="form" autocomplete="off">
    <button class="ibtn" id="attachBtn" type="button" aria-label="attach">
      <svg viewBox="0 0 24 24"><path d="m21 11-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>
    </button>
    <input id="input" enterkeyhint="send" autocapitalize="sentences" autocomplete="off" autocorrect="on" spellcheck="false">
    <button class="send" type="submit">OK</button>
  </form>

  <input type="file" id="file" accept="image/*,.txt,.md,.csv,.json,text/plain" hidden>
  <input type="file" id="avatarFile" accept="image/*" hidden>
  <div id="floatNote"></div>
</div>

<script src="i18n.js"></script>
<script src="i18n-pwa.js"></script>
<script>
(() => {
'use strict';
const I = window.CapriI18n;
const $ = s => document.querySelector(s);
/* Todas las referencias se guardan al inicio: el panel se puede mover a otra ventana (flotante) */
const el = {
  app: $('#app'), log: $('#log'), input: $('#input'), form: $('#form'), brain: $('#brain'), pet: $('#pet'),
  avatarImg: $('#avatarImg'), robot: $('#robot'), attachBtn: $('#attachBtn'), file: $('#file'),
  chip: $('#chip'), chipName: $('#chipName'), chipX: $('#chipX'), soundBtn: $('#soundBtn'),
  avatarBtn: $('#avatarBtn'), avatarFile: $('#avatarFile'), floatBtn: $('#floatBtn'), floatNote: $('#floatNote'),
  hint: $('#hint'), hintText: $('#hintText'), hintX: $('#hintX')
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ===================== ALMACENAMIENTO ===================== */
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const S = Object.assign({ key: '', model: 'claude-sonnet-5-5', city: '', lang: null, sound: false, theme: 'cyan', web: true, free: true }, ls.get('capri_settings', {}));
let memory = ls.get('capri_memory', { facts: [] });
let tasks = ls.get('capri_tasks', []);
let chatLog = ls.get('capri_log', []);
const saveS = () => ls.set('capri_settings', S);
const saveMem = () => ls.set('capri_memory', memory);
const saveTasks = () => ls.set('capri_tasks', tasks);
const saveLog = () => ls.set('capri_log', chatLog.slice(-60));

if (!S.lang || !I.LANGS[S.lang]) S.lang = I.detect(navigator.language);
const T = (k, p) => I.t(S.lang, k, p);
const locale = () => I.LANGS[S.lang].locale;

/* ===================== INTERFAZ ===================== */
let pipWin = null;
const THEMES = { rosa: ['#ff2bd6', '#00f0ff'], cian: ['#00f0ff', '#ff2bd6'], amarillo: ['#fcee0a', '#ff2bd6'], capri: ['#3dff7a', '#ff2b4d'] };
const THEME_ALIAS = { pink: 'rosa', rosa: 'rosa', cyan: 'cian', cian: 'cian', yellow: 'amarillo', amarillo: 'amarillo', capri: 'capri' };
function setTheme(name) {
  const t = THEMES[name]; if (!t) return false;
  for (const root of [document.documentElement, pipWin && pipWin.document.documentElement]) {
    if (!root) continue;
    root.style.setProperty('--cyan', t[0]); root.style.setProperty('--pink', t[1]);
  }
  S.theme = name; saveS();
  return true;
}

function refreshBrain() {
  el.brain.textContent = S.key ? T('brainAI', { m: S.model.replace('claude-', '') }) : S.free ? T('brainFree') : T('brainNone');
  el.brain.classList.toggle('on', !!S.key || !!S.free);
}
function setStatus(t) { el.brain.textContent = '> ' + t; el.brain.style.color = 'var(--yellow)'; }
function clearStatus() { el.brain.style.color = ''; refreshBrain(); }
function applyLang() {
  document.documentElement.lang = S.lang;
  el.app.dir = I.LANGS[S.lang].dir;
  el.input.placeholder = T('placeholder');
  el.soundBtn.title = el.soundBtn.ariaLabel = T('tipSound');
  el.avatarBtn.title = el.avatarBtn.ariaLabel = T('tipAvatar');
  el.floatBtn.title = el.floatBtn.ariaLabel = T('tipFloat');
  el.attachBtn.title = el.attachBtn.ariaLabel = T('tipAttach');
  el.floatNote.textContent = T('floatingNote');
  el.hintText.textContent = T('installHint');
  el.soundBtn.classList.toggle('on', !!S.sound);
  refreshBrain();
}
function setState(s) {
  el.pet.classList.remove('talking', 'thinking');
  if (s) el.pet.classList.add(s);
}
function addMsg(text, who, persist = true, ai = false) {
  const d = document.createElement('div');
  d.className = 'msg ' + who; d.dir = 'auto'; d.textContent = text;
  el.log.appendChild(d); el.log.scrollTop = el.log.scrollHeight;
  if (persist) { chatLog.push({ who, text, ai }); saveLog(); }
  return d;
}
function dotsMsg() {
  const d = addMsg('', 'bot', false);
  d.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span>';
  return d;
}
async function typeInto(node, text) {
  setState('talking'); node.textContent = '';
  const step = text.length > 500 ? 6 : text.length > 200 ? 3 : 1;
  for (let i = 0; i < text.length; i += step) {
    node.textContent += text.slice(i, i + step);
    el.log.scrollTop = el.log.scrollHeight; await sleep(12);
  }
  chatLog.push({ who: 'bot', text }); saveLog();
  speak(text);
  setState(null);
}
async function botSay(text) { setState('thinking'); const n = dotsMsg(); await sleep(250 + Math.random() * 250); await typeInto(n, text); }

/* Markdown seguro: se construye con nodos DOM, nunca con innerHTML */
function mkLink(href, text) {
  const a = document.createElement('a');
  a.href = href; a.textContent = text; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
}
function mdInline(parent, s) {
  const re = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>]+)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
    if (m[1] !== undefined) { const c = document.createElement('code'); c.textContent = m[1]; parent.appendChild(c); }
    else if (m[2] !== undefined) { const b = document.createElement('strong'); b.textContent = m[2]; parent.appendChild(b); }
    else if (m[4] !== undefined) parent.appendChild(mkLink(m[4], m[3]));
    else {
      let url = m[5], tail = '';
      const t = /[.,;:!?)\]'"]+$/.exec(url);
      if (t) { tail = t[0]; url = url.slice(0, -tail.length); }
      parent.appendChild(mkLink(url, url));
      if (tail) parent.appendChild(document.createTextNode(tail));
    }
    last = re.lastIndex;
  }
  if (last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
}
function renderMarkdown(root, text) {
  root.textContent = '';
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const isBullet = l => /^\s*[-*•]\s+/.test(l), isNum = l => /^\s*\d+[.)]\s+/.test(l);
  const isHead = l => /^#{1,6}\s+/.test(l), isTable = l => /^\s*\|/.test(l), isFence = l => /^\s*```/.test(l);
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (isFence(line)) {
      const buf = []; i++;
      while (i < lines.length && !isFence(lines[i])) buf.push(lines[i++]);
      i++;
      const pre = document.createElement('pre'), code = document.createElement('code');
      code.textContent = buf.join('\n'); pre.appendChild(code); root.appendChild(pre); continue;
    }
    if (!line.trim()) { i++; continue; }
    if (isHead(line)) {
      const h = document.createElement('div'); h.className = 'h'; h.dir = 'auto';
      mdInline(h, line.replace(/^#{1,6}\s+/, '')); root.appendChild(h); i++; continue;
    }
    if (isBullet(line) || isNum(line)) {
      const ordered = isNum(line);
      const list = document.createElement(ordered ? 'ol' : 'ul');
      if (ordered) list.start = parseInt(/\d+/.exec(line)[0], 10);
      while (i < lines.length && (ordered ? isNum(lines[i]) : isBullet(lines[i]))) {
        const li = document.createElement('li'); li.dir = 'auto';
        mdInline(li, lines[i].replace(ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*•]\s+/, '')); list.appendChild(li); i++;
      }
      root.appendChild(list); continue;
    }
    if (isTable(line)) {
      const buf = []; while (i < lines.length && isTable(lines[i])) buf.push(lines[i++]);
      const pre = document.createElement('pre'); pre.textContent = buf.join('\n'); root.appendChild(pre); continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isFence(lines[i]) && !isHead(lines[i]) && !isBullet(lines[i]) && !isNum(lines[i]) && !isTable(lines[i])) buf.push(lines[i++]);
    const p = document.createElement('p'); p.dir = 'auto'; mdInline(p, buf.join('\n')); root.appendChild(p);
  }
  if (!root.firstChild) root.textContent = text;
}
function plainForSpeech(t) {
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/https?:\/\/\S+/g, '').replace(/[*#`_>|•]/g, '').replace(/\s+/g, ' ').trim();
}
function finishAI(holder, text, ok) {
  if (ok) { holder.classList.add('md'); renderMarkdown(holder, text); } else holder.textContent = text;
  chatLog.push({ who: 'bot', text, ai: !!ok }); saveLog();
  el.log.scrollTop = el.log.scrollHeight;
  speak(plainForSpeech(text)); setState(null);
}

/* ===================== VOZ (leer en voz alta) ===================== */
function unlockSpeech() { try { if (S.sound && 'speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch {} }
function speak(text) {
  try {
    if (!S.sound || !('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = locale(); u.pitch = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}

/* ===================== AVATAR ===================== */
function showAvatar(src) {
  if (src) { el.avatarImg.src = src; el.avatarImg.hidden = false; el.robot.style.display = 'none'; }
  else { el.avatarImg.hidden = true; el.avatarImg.removeAttribute('src'); el.robot.style.display = ''; }
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function scaled(img, max, type, q) {
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  const ctx = c.getContext('2d');
  if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL(type, q);
}

/* ===================== HERRAMIENTAS ===================== */
const TOOLS = [
  { name: 'remember', description: 'Guarda un hecho corto y estable sobre el usuario (nombre, ciudad, estudios, gustos, horarios, proyectos). No guardar secretos ni datos sensibles.',
    input_schema: { type: 'object', properties: { fact: { type: 'string', description: 'Hecho breve y neutro' } }, required: ['fact'] } },
  { name: 'forget', description: 'Olvida un hecho guardado, por su id (aparece entre corchetes en la memoria).',
    input_schema: { type: 'object', properties: { id: { type: 'string' } }, required: ['id'] } },
  { name: 'add_task', description: 'Añade una tarea a la lista del usuario.',
    input_schema: { type: 'object', properties: { text: { type: 'string' } }, required: ['text'] } },
  { name: 'list_tasks', description: 'Devuelve las tareas pendientes numeradas.', input_schema: { type: 'object', properties: {} } },
  { name: 'complete_task', description: 'Marca como hecha (y elimina) una tarea por su número.',
    input_schema: { type: 'object', properties: { number: { type: 'integer' } }, required: ['number'] } },
  { name: 'get_time', description: 'Fecha y hora actuales del usuario.', input_schema: { type: 'object', properties: {} } },
  { name: 'get_weather', description: 'Clima actual y previsión de hoy y mañana. Si no se indica ciudad, usa la guardada del usuario.',
    input_schema: { type: 'object', properties: { city: { type: 'string' } } } },

/* Evaluador de expresiones propio (sin eval ni Function): + - * / % ^ y paréntesis */
function calc(expr) {
  const s = String(expr).replace(/,/g, '.').replace(/\s+/g, '').replace(/\*\*/g, '^');
  if (!s || !/^[\d+\-*/().%^]+$/.test(s)) return 'Invalid expression.';
  let i = 0;
  const fail = () => { throw new Error('syntax'); };
  function expression() {
    let v = term();
    while (s[i] === '+' || s[i] === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
    return v;
  }
  function term() {
    let v = unary();
    while (s[i] === '*' || s[i] === '/' || s[i] === '%') {
      const op = s[i++]; const r = unary();
      v = op === '*' ? v * r : op === '/' ? v / r : v % r;
    }
    return v;
  }
  function unary() {
    if (s[i] === '-') { i++; return -unary(); }
    if (s[i] === '+') { i++; return unary(); }
    return power();
  }
  function power() {
    const b = primary();
    if (s[i] === '^') { i++; return Math.pow(b, unary()); }
    return b;
  }
  function primary() {
    if (s[i] === '(') { i++; const v = expression(); if (s[i] !== ')') fail(); i++; return v; }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
    if (!m) fail();
    i += m[0].length; return parseFloat(m[0]);
  }
  try {
    const r = expression();
    if (i !== s.length) fail();
    return Number.isFinite(r) ? String(+r.toPrecision(12)) : 'Not a valid number.';
  } catch { return 'Invalid expression.'; }
}
function setReminder(minutes, text) {
  const m = Math.min(Math.max(Number(minutes) || 1, 1), 1440);
  setTimeout(() => {
    const msg = T('reminderMsg', { t: text });
    addMsg(msg, 'bot'); speak(msg);
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Capri', { body: text }); } catch {}
  }, m * 60000);
  return `Reminder set in ${m} min (it only rings while Capri is open on this device).`;
}
async function runTool(name, input = {}) {
  switch (name) {
    case 'remember': {
      const text = String(input.fact || '').trim().slice(0, 300);
      if (!text) return 'Empty fact.';
      const id = Math.random().toString(36).slice(2, 6);
      memory.facts.push({ id, text, date: new Date().toISOString().slice(0, 10) });
      if (memory.facts.length > 80) memory.facts.shift();
      saveMem(); return `Saved [${id}].`;
    }
    case 'forget': {
      const n = memory.facts.length;
      memory.facts = memory.facts.filter(f => f.id !== String(input.id)); saveMem();
      return memory.facts.length < n ? 'Forgotten.' : 'No fact with that id.';
    }
    case 'add_task': tasks.push(String(input.text || '').slice(0, 200)); saveTasks(); return T('taskSaved', { n: tasks.length });
    case 'list_tasks': return tasks.length ? tasks.map((t, i) => `${i + 1}. ${t}`).join('\n') : T('taskNone');
    case 'complete_task': {
      const i = Number(input.number) - 1;
      if (tasks[i] === undefined) return T('taskMissing');
      const [t] = tasks.splice(i, 1); saveTasks(); return T('taskDone', { t });
    }
    case 'get_time': return new Date().toLocaleString(locale(), { dateStyle: 'full', timeStyle: 'short' });
    case 'get_weather': return weather(input.city);
    case 'set_reminder': return setReminder(input.minutes, String(input.text || 'Reminder'));
    case 'calculate': return calc(input.expression);
    case 'set_theme': return setTheme(THEME_ALIAS[String(input.name)] || '') ? 'Theme changed.' : 'Unknown theme.';
    default: return 'Unknown tool.';
  }
}

/* Llama a la API en streaming: el texto aparece mientras se escribe */
async function streamClaude(hooks) {
  const ctl = new AbortController();
  let timer; const bump = () => { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), 60000); };
  bump();
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: ctl.signal,
      headers: {
        'content-type': 'application/json', 'x-api-key': S.key, 'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: S.model, max_tokens: 4096, stream: true, system: systemPrompt(), tools: allTools(), messages: history })
    });
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).error?.message || ''; } catch {}
      const e = new Error(msg || 'HTTP ' + r.status); e.status = r.status; throw e;
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    const blocks = [], jsons = []; let stop = null, buf = '';
    const textNow = () => blocks.filter(b => b && b.type === 'text').map(b => b.text).join('');
    const handle = ev => {
      switch (ev.type) {
        case 'content_block_start': {
          const b = JSON.parse(JSON.stringify(ev.content_block));
          if (b.type === 'text') b.text = b.text || '';
          blocks[ev.index] = b; jsons[ev.index] = '';
          if (b.type === 'server_tool_use' && hooks && hooks.onStatus) hooks.onStatus(T('searching'));
          break;
        }
        case 'content_block_delta': {
          const b = blocks[ev.index]; if (!b) break;
          const d = ev.delta;
          if (d.type === 'text_delta') { b.text += d.text; if (hooks && hooks.onText) hooks.onText(textNow()); }
          else if (d.type === 'input_json_delta') jsons[ev.index] += d.partial_json;
          else if (d.type === 'citations_delta') (b.citations = b.citations || []).push(d.citation);
          break;
        }
        case 'content_block_stop': {
          const b = blocks[ev.index];
          if (b && (b.type === 'tool_use' || b.type === 'server_tool_use')) {
            try { b.input = jsons[ev.index] ? JSON.parse(jsons[ev.index]) : {}; } catch { b.input = {}; }
          }
          break;
        }
        case 'message_delta': if (ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason; break;
        case 'error': {
          const e = new Error((ev.error && ev.error.message) || 'stream error');
          e.status = ev.error && ev.error.type === 'overloaded_error' ? 529 : 500; throw e;
        }
      }
    };
    const feed = raw => {
      const line = raw.split('\n').find(l => l.startsWith('data:'));
      if (!line) return;
      let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { return; }
      handle(ev);
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      bump();
      buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { const raw = buf.slice(0, i); buf = buf.slice(i + 2); feed(raw); }
    }
    if (buf.trim()) feed(buf);
    return { content: blocks.filter(b => b && !(b.type === 'text' && !b.text)), stop_reason: stop };
  } finally { clearTimeout(timer); }
}
const textOf = c => c.filter(b => b.type === 'text').map(b => b.text).join('');
function sourcesOf(content) {
  const seen = new Map();
  for (const b of content) for (const c of (b.citations || [])) if (c && c.url && !seen.has(c.url)) seen.set(c.url, c.title || c.url);
  return [...seen].slice(0, 5).map(([u, t]) => `• ${t} — ${u}`);
}
/* Devuelve { text, ok }. hooks: onText(texto parcial), onStatus(estado) */
async function ask(content, hooks) {
  const mark = history.length;
  history.push({ role: 'user', content });
  let carry = '', all = [], webNote = '';
  try {
    for (let n = 0; n < 8; n++) {
      let data;
      try { data = await streamClaude(hooks); }
      catch (e) {
        // si la cuenta no tiene la búsqueda web activada, se apaga y se reintenta sin ella
        if (e.status === 400 && S.web && /web.?search/i.test(e.message || '')) {
          S.web = false; saveS(); webNote = T('webFail') + '\n\n'; data = await streamClaude(hooks);
        } else throw e;
      }
      history.push({ role: 'assistant', content: data.content });
      if (data.stop_reason === 'pause_turn') { carry += textOf(data.content); all = all.concat(data.content); continue; }
      const uses = data.content.filter(b => b.type === 'tool_use');
      if (!uses.length) {
        let out = (carry + textOf(data.content)).trim();
        const src = sourcesOf(all.concat(data.content));
        if (out && src.length) out += '\n\n' + T('sources') + ':\n' + src.join('\n');
        trimHistory();
        return { text: webNote + (out || '...'), ok: true };
      }
      const results = [];
      for (const u of uses) {
        let out; try { out = await runTool(u.name, u.input); } catch (e) { out = 'Error: ' + e.message; }
        results.push({ type: 'tool_result', tool_use_id: u.id, content: String(out) });
      }
      history.push({ role: 'user', content: results });
    }
    trimHistory(); return { text: T('eLoop'), ok: false };
  } catch (e) {
    history.length = mark;
    const text = e.status === 401 ? T('eKey')
      : (e.status === 429 || e.status === 529) ? T('eRate')
      : e.status === 404 ? T('eModel', { m: S.model })
      : e.name === 'AbortError' ? T('eTimeout')
      : T('eLink', { e: e.message });
    return { text, ok: false };
  } finally { clearStatus(); }
}

const ALIAS = {
  '/key': 'key', '/clave': 'key', '/city': 'city', '/ciudad': 'city', '/model': 'model', '/modelo': 'model',
  '/language': 'language', '/idioma': 'language', '/sound': 'sound', '/voz': 'sound',
  '/task': 'task', '/tarea': 'task', '/tasks': 'tasks', '/tareas': 'tasks', '/done': 'done', '/hecho': 'done',
  '/theme': 'theme', '/tema': 'theme', '/memory': 'memory', '/memoria': 'memory', '/new': 'new', '/nueva': 'new',
  '/forgetall': 'forgetall', '/olvidatodo': 'forgetall',
  '/web': 'web', '/free': 'free', '/gratis': 'free', '/buscar': 'web', '/help': 'help', '/ayuda': 'help', '/hilfe': 'help', '/aide': 'help', '/ajuda': 'help'
};
async function command(text) {
  const parts = text.trim().split(/\s+/);
  const cmd = ALIAS[parts[0].toLowerCase()];
  const arg = parts.slice(1).join(' ').trim();
  switch (cmd) {
    case 'key':
      if (!arg) return T('keyUsage');
      S.key = arg; saveS(); refreshBrain(); return T('keySaved');
    case 'city':
      if (!arg) return T('cityCur', { c: S.city || T('cityNone') });
      S.city = arg; saveS(); return T('citySaved', { c: arg });
    case 'model':
      if (!arg) return T('modelCur', { m: S.model });
      S.model = arg; saveS(); refreshBrain(); return T('modelSet', { m: arg });
    case 'language': {
      const code = arg.toLowerCase();
      if (!code) return T('langCur', { l: I.LANGS[S.lang].name, list: I.list() });
      if (!I.LANGS[code]) return T('langBad', { list: I.list() });
      S.lang = code; saveS(); applyLang();
      return T('langSet', { l: I.LANGS[code].name });
    }
    case 'sound': {
      const v = arg.toLowerCase();
      S.sound = v === 'on' ? true : v === 'off' ? false : !S.sound;
      saveS(); applyLang(); if (!S.sound) { try { speechSynthesis.cancel(); } catch {} }
      return S.sound ? T('soundOn') : T('soundOff');
    }
    case 'web': {
      const v = arg.toLowerCase();
      S.web = v === 'on' ? true : v === 'off' ? false : !S.web; saveS();
      return S.web ? T('webOn') : T('webOff');
    }
    case 'task': return arg ? runTool('add_task', { text: arg }) : T('taskUsage');
    case 'tasks': return runTool('list_tasks');
    case 'done': return runTool('complete_task', { number: parseInt(arg, 10) });
    case 'theme': { const n = THEME_ALIAS[arg.toLowerCase()]; return n && setTheme(n) ? T('themeSet', { n: arg }) : 'pink | cyan | yellow | capri'; }
    case 'memory': return memory.facts.length ? T('memHdr') + '\n' + memory.facts.map(f => '• ' + f.text).join('\n') : T('memNone');
    case 'new': history = []; chatLog.forEach(m => { m.ai = false; }); saveLog(); return T('newConv');
    case 'forgetall':
      memory.facts = []; saveMem(); history = []; chatLog = []; saveLog(); el.log.textContent = '';
      return T('forgot');
    case 'free':
      if (/^(off|no|0)$/i.test(arg)) S.free = false; else if (/^(on|si|sí|1)$/i.test(arg) || !arg) S.free = true; else return T('freeUsage');
      saveS(); refreshBrain(); return S.free ? T('freeOn') : T('freeOff');
    case 'help': return T('helpPwa');
    default: return T('unknown');
  }
}

        if (tryBasic !== T('basicOnly') && /^[\d\s+\-*/().,%^]+$/.test(text.trim())) await botSay(tryBasic);
        else {
          if (!ls.get('capri_free_ok', false)) { ls.set('capri_free_ok', true); addMsg(T('freeNote'), 'bot', false); }
          setState('thinking'); const holder = dotsMsg();
          try { const out = await freeAsk(text); finishAI(holder, out, true); }
          catch (e) { finishAI(holder, T('freeFail') + '\n\n' + basicBrain(text), false); }
        }
      } else await botSay(basicBrain(text));
    } else {
      addMsg((att ? '📎 ' + att.name + (text ? '\n' : '') : '') + text, 'me', true, true);
      const entry = chatLog[chatLog.length - 1];
      const content = buildContent(text, att);
      setPending(null);
      setState('thinking');
      const holder = dotsMsg();
      const res = await ask(content, {
        onText: t => { holder.textContent = t; el.log.scrollTop = el.log.scrollHeight; setState('talking'); },
        onStatus: st => setStatus(st)
      });
      if (!res.ok && entry) entry.ai = false;
      finishAI(holder, res.text, res.ok);
    }
  } catch (err) {
    setState(null); await botSay(T('signalFail', { e: err.message }));
  }
  busy = false;
});

/* ===================== BOTONES ===================== */
el.attachBtn.addEventListener('click', () => el.file.click());
el.file.addEventListener('change', async e => { await pickFile(e.target.files[0]); e.target.value = ''; });
el.chipX.addEventListener('click', () => setPending(null));
el.soundBtn.addEventListener('click', () => { S.sound = !S.sound; saveS(); applyLang(); if (!S.sound) { try { speechSynthesis.cancel(); } catch {} } else { unlockSpeech(); } });
el.avatarBtn.addEventListener('click', () => el.avatarFile.click());
el.avatarFile.addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const src = scaled(await loadImage(f), 500, 'image/png');
    showAvatar(src);
    if (!ls.set('capri_avatar', src)) addMsg(T('attachBad'), 'bot', false);
  } catch { addMsg(T('attachBad'), 'bot', false); }
});

/* Ventana flotante (Document Picture-in-Picture: Chrome en ordenador y Chromebook) */
if ('documentPictureInPicture' in window) el.floatBtn.hidden = false;
el.floatBtn.addEventListener('click', async () => {
  if (pipWin) { pipWin.close(); return; }
  if (!('documentPictureInPicture' in window)) { addMsg(T('floatNo'), 'bot', false); return; }
  try {
    pipWin = await window.documentPictureInPicture.requestWindow({ width: 380, height: 560 });
  } catch { addMsg(T('floatNo'), 'bot', false); return; }
  const w = pipWin;
  document.querySelectorAll('style').forEach(s => w.document.head.appendChild(s.cloneNode(true)));
  const root = w.document.documentElement;
  root.lang = document.documentElement.lang;
  root.style.cssText = document.documentElement.style.cssText;
  el.app.style.height = '';
  w.document.body.appendChild(el.app);
  el.floatNote.classList.remove('show');
  document.body.insertAdjacentHTML('beforeend', '<div id="floatBack" style="position:fixed;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--yellow);font-size:16px;line-height:1.5"></div>');
  document.getElementById('floatBack').textContent = T('floatingNote');
  w.addEventListener('pagehide', () => {
    document.body.appendChild(el.app);
    const b = document.getElementById('floatBack'); if (b) b.remove();
    pipWin = null; fitViewport();
  });
});

/* ===================== ARRANQUE ===================== */
function fitViewport() {
  if (pipWin || !window.visualViewport) return;
  el.app.style.height = window.visualViewport.height + 'px';
  window.scrollTo(0, 0);
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitViewport); fitViewport(); }

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
if (isIOS && !ls.get('capri_hint_done', false)) {
  el.hintText.textContent = T('installHint'); el.hint.classList.add('show');
  el.hintX.addEventListener('click', () => { el.hint.classList.remove('show'); ls.set('capri_hint_done', true); });
}

setTheme(THEMES[S.theme] ? S.theme : 'cian');
showAvatar(ls.get('capri_avatar', null));
applyLang();
chatLog.forEach(m => {
  const d = addMsg(m.text, m.who, false);
  if (m.ai && m.who === 'bot') { d.classList.add('md'); renderMarkdown(d, m.text); }
});
rebuildHistory();
if (!chatLog.length) addMsg(S.key ? T('welcomeKey') : S.free ? T('welcomeFree') : T('welcomeNoKey'), 'bot');

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
